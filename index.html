<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашнее задание JavaScript</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <h1>Домашнее задание по JavaScript</h1>

    <section class="task">
        <h2>1. Счётчик</h2>

        <div class="counter">
            <button id="decrement">−</button>
            <span id="count">0</span>
            <button id="increment">+</button>
        </div>
    </section>

    <section class="task">
        <h2>2. Координаты мыши</h2>
        <p>Перемещайте мышь внутри блока.</p>

        <div id="mouseArea">
            <span id="coordinates">x: 0, y: 0</span>
        </div>
    </section>

    <section class="task">
        <h2>3. Изменение цвета фона</h2>

        <input
            type="text"
            id="colorInput"
            placeholder="Введите цвет: red, blue, green..."
        >

        <p id="colorMessage">Введите название цвета.</p>
    </section>

    <script src="/script.js"></script>
</body>
</html>
